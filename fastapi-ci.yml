
name: FastAPI Build and Artifact Validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - test
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-validate:
    name: Build and Validate FastAPI Artifact
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout source code
        uses: actions/checkout@v4

      # 2. Setup Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements.txt

      # 3. Install dependencies
      - name: Install dependencies
        working-directory: server
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      # 4. Validate Python syntax
      - name: Validate Python syntax
        run: |
          python -m compileall -q server
          echo "Python syntax validation passed"

      # 5. Validate FastAPI application import
      - name: Validate FastAPI application
        working-directory: server
        run: |
          python -c "from app.main import app; print('FastAPI application loaded:', app.title)"

      # 6. Run automated tests
      - name: Run tests
        run: |
          if [ -d tests ]; then
            python -m pytest tests -v
          else
            echo "No tests directory found"
            exit 1
          fi

      # 7. Build deployment artifact
      - name: Build artifact
        run: |
          mkdir -p dist
          tar \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            --exclude='.git' \
            --exclude='venv' \
            --exclude='.venv' \
            --exclude='.env' \
            --exclude='*.db' \
            -czf dist/fastapi-backend.tar.gz \
            server tests requirements.txt

      # 8. Validate generated artifact
      - name: Validate artifact
        run: |
          test -s dist/fastapi-backend.tar.gz
          tar -tzf dist/fastapi-backend.tar.gz \
            | grep -q '^server/app/main.py$'
          tar -tzf dist/fastapi-backend.tar.gz \
            | grep -q '^server/requirements.txt$'
          tar -tzf dist/fastapi-backend.tar.gz \
            | grep -q '^tests/'
          echo "Artifact validation passed"

      # 9. Upload artifact to GitHub Actions
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: fastapi-backend-${{ github.sha }}
          path: dist/fastapi-backend.tar.gz
          if-no-files-found: error
          retention-days: 14
